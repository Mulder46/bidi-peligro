<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>¡Cuidado con lo que escaneas!</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
      padding: 3em;
    }
    .warning {
      font-size: 2em;
      color: #ff4444;
      margin-bottom: 1em;
    }
    .contador {
      margin-top: 2em;
      font-size: 1.2em;
      color: #ccc;
    }
    button {
      margin-top: 2em;
      padding: 1em 2em;
      font-size: 1em;
      background-color: #ff4444;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="warning">¡CUIDADO!</div>
  <p>Has escaneado un código QR desconocido.</p>
  <p>Podría haberte llevado a un sitio malicioso, instalar algo sin que lo sepas, o robar tus datos.</p>

  <button onclick="alert('Un QR podría instalar un virus, conectarte a una red falsa o robarte tus contraseñas. ¡Verifica siempre antes de escanear!')">
    ¿Qué podría haber pasado?
  </button>

  <div class="contador">
    Personas que escanearon este QR: <span id="visitas">...</span>
  </div>

  <script>
    fetch('https://api.countapi.xyz/hit/pixelnomada/bidi-alerta')
      .then(res => res.json())
      .then(data => {
        document.getElementById("visitas").textContent = data.value;
      });
  </script>

</body>
</html>
