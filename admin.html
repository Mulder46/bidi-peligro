
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de visitas</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #222;
      color: #fff;
      text-align: center;
      padding: 3em;
    }
    h1 {
      font-size: 2.5em;
      color: #00ffcc;
    }
    #contador {
      font-size: 3em;
      margin-top: 1em;
    }
  </style>
</head>
<body>
  <h1>Visitas totales</h1>
  <div id="contador">...</div>

  <script>
    fetch('https://api.countapi.xyz/get/pixelnomada/bidi-alerta')
      .then(res => res.json())
      .then(data => {
        document.getElementById("contador").textContent = data.value;
      });
  </script>
</body>
</html>
